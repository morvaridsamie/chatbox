<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Message Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f4ef; /* Creamy off-white background */
            font-family: 'Inter', sans-serif;
            color: #4a443f; /* Dark ashy brown text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            background-color: #efece6; /* Warm beige */
            border: 1px solid #dcd7ce; /* Ashy beige border */
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            height: 520px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(74, 68, 63, 0.05);
            overflow: hidden;
        }

        .chat-header {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid #e2ddd3;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #3b3531; /* Deep ashy brown */
            margin-bottom: 6px;
        }

        .chat-header p {
            font-size: 13px;
            color: #8c827a; /* Soft muted brown */
            font-weight: 300;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 12px;
        }

        .message-prompt {
            background-color: #f7f4ef;
            color: #6e655f;
            padding: 14px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            border: 1px solid #e5dfd5;
        }

        .status-message {
            display: none;
            background-color: #e3ded5;
            color: #4a443f;
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            font-size: 13px;
            align-self: flex-end;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .chat-input-area {
            padding: 16px 20px 20px;
            border-top: 1px solid #e2ddd3;
            display: flex;
            gap: 10px;
            background-color: #efece6;
        }

        input[type="text"] {
            flex: 1;
            background-color: #f7f4ef;
            border: 1px solid #dcd7ce;
            border-radius: 25px;
            padding: 12px 20px;
            color: #3b3531;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #aaa29a;
        }

        input[type="text"]:focus {
            border-color: #a89f91;
            background-color: #ffffff;
        }

        button {
            background-color: #7a7067; /* Muted ashy brown */
            color: #f7f4ef;
            border: none;
            border-radius: 25px;
            padding: 0 22px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #635a52;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Leave a Note</h1>
            <p>Drop your thoughts.</p>
        </div>

        <div class="chat-body">
            <div class="message-prompt">
                Feel free to tell me anything, I won't know who you are :)
            </div>
            <div class="status-message" id="status-msg"></div>
        </div>

        <form class="chat-input-area" id="anon-form" onsubmit="submitMessage(event)">
            <input type="text" id="message-input" placeholder="Type your thought..." required autocomplete="off" />
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        // Replace this with your actual Formspree endpoint ID
        const FORMSPREE_ID = "https://formspree.io/f/mvkprorz";

        async function submitMessage(event) {
            event.preventDefault();
            
            const input = document.getElementById('message-input');
            const statusMsg = document.getElementById('status-msg');
            const sendBtn = document.getElementById('send-btn');
            const messageText = input.value.trim();

            if (!messageText) return;

            // Disable input while sending
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerText = "...";

            try {
                const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ message: messageText })
                });

                if (response.ok) {
                    showStatus("Sent. Thank you for sharing.");
                    input.value = "";
                } else {
                    showStatus("Couldn't send. Please try again.");
                }
            } catch (error) {
                showStatus("An error occurred. Please try again.");
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = "Send";
            }
        }

        function showStatus(text) {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = text;
            statusMsg.style.display = 'block';
        }
    </script>
</body>
</html>
